<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Day 19 - Student Checker</title>

<script src="script.js" defer></script>

</head><body><h1>Student Checker</h1>

<!-- Task 1: Age Checker -->
<h2>Task 1: Age Checker</h2>

<form id="ageForm">

    <label for="age">Enter your age:</label>
    <input type="number" id="age" step="any" placeholder="Enter your age">

    <button type="submit">Check Age</button>

</form>

<p id="ageResult"></p>

<hr>


<!-- Task 2: Number Checker -->
<h2>Task 2: Number Checker</h2>

<form id="numberForm">

    <label for="numberInput">Enter a number:</label>
    <input type="number" id="numberInput" step="any" placeholder="Enter a number">

    <button type="submit">Check Number</button>

</form>

<p id="numberResult"></p>

<hr>


<!-- Task 3: Grade Checker -->
<h2>Task 3: Grade Checker</h2>

<form id="gradeForm">

    <label for="scoreInput">Enter your score:</label>
    <input type="number" id="scoreInput" step="any" placeholder="Score from 0 to 100">

    <button type="submit">Check Grade</button>

</form>

<p id="gradeResult"></p>

<hr>


<!-- Task 4: Even or Odd -->
<h2>Task 4: Even or Odd</h2>

<form id="evenOddForm">

    <label for="evenOddInput">Enter an integer:</label>
    <input type="number" id="evenOddInput" step="any" placeholder="Enter a number">

    <button type="submit">Check Number</button>

</form>

<p id="evenOddResult"></p>

<hr>


<!-- Task 5: Login Checker -->
<h2>Task 5: Login Checker</h2>

<form id="loginForm">

    <label for="username">Username:</label>
    <input type="text" id="username" placeholder="Enter username">

    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Enter password">

    <br><br>

    <button type="submit">Login</button>

</form>

<p id="loginResult"></p>

<hr>


<!-- Task 6: Ternary Operator -->
<h2>Task 6: Ternary Operator</h2>

<form id="ternaryForm">

    <label for="ternaryAge">Enter your age:</label>
    <input type="number" id="ternaryAge" step="any" placeholder="Enter your age">

    <button type="submit">Check Age</button>

</form>

<p id="ternaryResult"></p>

<hr>


<!-- Task 7: Access Checker -->
<h2>Task 7: Access Checker</h2>

<form id="accessForm">

    <label for="accessAge">Enter your age:</label>
    <input type="number" id="accessAge" step="any" placeholder="Enter your age">

    <br><br>

    <label>
        <input type="checkbox" id="hasID">
        I have an ID
    </label>

    <br><br>

    <button type="submit">Check Access</button>

</form>

<p id="accessResult"></p>

<hr>


<!-- Bonus: Student Result Checker -->
<h2>Bonus: Student Result Checker</h2>

<form id="studentForm">

    <label for="studentName">Student Name:</label>
    <input type="text" id="studentName" placeholder="Enter student name">

    <br><br>

    <label for="studentScore">Score:</label>
    <input type="number" id="studentScore" step="any" placeholder="Score from 0 to 100">

    <br><br>

    <button type="submit">Check Student Result</button>

</form>

<pre id="studentResult"></pre>

</body></html>
